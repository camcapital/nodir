[package]
name = "nodir-desktop"
description = "The NoDir desktop app"
version.workspace = true
edition.workspace = true
rust-version = "1.90" # Tauri 2.12 needs 1.90; core and CLI stay at 1.89.
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib's name apart from the binary's, which
# Windows needs (cargo#8519).
name = "nodir_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nodir-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
percent-encoding = "2"
dunce = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
