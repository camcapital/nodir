[workspace]
resolver = "2"
members = ["crates/nodir-core", "crates/nodir-cli"]
# apps/desktop (Tauri v2) joins the workspace in stage 2.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/camcapital/nodir"

[workspace.dependencies]
nodir-core = { path = "crates/nodir-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
