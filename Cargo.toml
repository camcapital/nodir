[workspace]
resolver = "2"
members = ["crates/nodir-core", "crates/nodir-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/camcapital/nodir"

[workspace.dependencies]
nodir-core = { path = "crates/nodir-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
